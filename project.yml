# XcodeGen project definition for Waggle.
# Regenerate the Xcode project with: xcodegen generate
#
# Info.plist is synthesized by Xcode (GENERATE_INFOPLIST_FILE = YES); Info
# keys are set via INFOPLIST_KEY_* below so there is no checked-in plist to
# drift out of sync.

name: Waggle

options:
  bundleIdPrefix: dev.jeanie
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Waggle:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Waggle
    settings:
      base:
        PRODUCT_NAME: Waggle
        PRODUCT_BUNDLE_IDENTIFIER: dev.jeanie.waggle
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Keep a standard app menu (so Cmd-Q quits cleanly) while the menu-bar
        # controller provides the primary controls.
        INFOPLIST_KEY_LSUIElement: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication

  WaggleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WaggleTests
    dependencies:
      - target: Waggle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
